name: Clean up artifacts

# Frees the account's Actions storage: deletes the artifacts (CI APKs, screenshots, test reports) of past runs.
# Releases and their APKs are not artifacts and are not touched. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      older-than-days:
        description: "Delete artifacts older than this many days (0 = all)"
        default: "0"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.older-than-days }}
        run: |
          cutoff=$(date -u -d "-${DAYS:-0} days" +%s)
          # List everything first: deleting while paging would shift the pages and skip some.
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | "\(.id) \(.size_in_bytes) \(.created_at)"' > artifacts.txt
          freed=0; count=0
          while read -r id size created; do
            [ -z "$id" ] && continue
            if [ "$(date -u -d "$created" +%s)" -le "$cutoff" ]; then
              gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && freed=$((freed + size)) && count=$((count + 1))
            fi
          done < artifacts.txt
          echo "Deleted $count of $(wc -l < artifacts.txt) artifacts, $((freed / 1048576)) MB freed" | tee -a "$GITHUB_STEP_SUMMARY"
