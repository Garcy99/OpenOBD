name: Release

# Publishes a GitHub release with the APK (and the App Bundle when signed).
# - Push a tag like v1.8.0, or
# - run it by hand (Actions -> Release -> Run workflow); the tag is created from versionName if not given.
# With the OPENOBD_* signing secrets (docs/RELEASING.md) the build is signed with your release key.
# Without them it is published as a pre-release signed with a temporary key, for testing only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to create, e.g. v1.8.0 (empty = v + versionName)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to collect the changelogs since the previous release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="${INPUT_VERSION:-v$NAME}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Decode signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENOBD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No OPENOBD_KEYSTORE_BASE64 secret: publishing a test pre-release signed with a temporary key (see docs/RELEASING.md)"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build APK and App Bundle
        env:
          OPENOBD_KEYSTORE_FILE: ${{ steps.key.outputs.signed == 'true' && 'release.jks' || '' }}
          OPENOBD_KEYSTORE_PASSWORD: ${{ secrets.OPENOBD_KEYSTORE_PASSWORD }}
          OPENOBD_KEY_ALIAS: ${{ secrets.OPENOBD_KEY_ALIAS }}
          OPENOBD_KEY_PASSWORD: ${{ secrets.OPENOBD_KEY_PASSWORD }}
        # The APK (GitHub, F-Droid) may show the donation button; the Play bundle is built with -Pplay, without it.
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease -Pplay
      - name: Collect files and release notes
        env:
          TAG: ${{ steps.v.outputs.tag }}
          CODE: ${{ steps.v.outputs.code }}
          SIGNED: ${{ steps.key.outputs.signed }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenOBD-$TAG.apk"
          if [ "$SIGNED" = "true" ]; then cp app/build/outputs/bundle/release/app-release.aab "dist/OpenOBD-$TAG.aab"; fi
          # Every version since the previous release tag, newest first.
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1)
          PREV_CODE=$( [ -n "$PREV" ] && git show "$PREV:app/build.gradle.kts" | grep -oP 'versionCode = \K[0-9]+' || echo $((CODE - 1)) )
          changes() {
            for c in $(seq "$CODE" -1 $((PREV_CODE + 1))); do
              f="fastlane/metadata/android/$1/changelogs/$c.txt"
              [ -f "$f" ] && cat "$f" && echo
            done
          }
          {
            echo "## What's new${PREV:+ since $PREV}"
            changes en-US
            echo "## Novedades${PREV:+ desde $PREV}"
            changes es-ES
            echo "## Install"
            echo "Download **OpenOBD-$TAG.apk** on your Android phone, tablet or car head unit (Android 6.0 or newer) and open it. Allow installing apps from your browser or file manager if asked."
            echo
            echo "## Instalar"
            echo "Descarga **OpenOBD-$TAG.apk** en tu móvil, tablet o pantalla del coche (Android 6.0 o superior) y ábrelo. Si te lo pide, permite instalar apps desde el navegador o el gestor de archivos."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> **Test build.** This APK is signed with a temporary key, so it cannot update a copy signed with a different key: uninstall the old copy first (back up in Settings → Backup to keep your garage and trips)."
              echo ">"
              echo "> **Versión de prueba.** Este APK está firmado con una clave temporal y no puede actualizar una copia firmada con otra clave: desinstala antes la anterior (haz una copia en Ajustes → Copia de seguridad para conservar tu garaje y viajes)."
            fi
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenOBD ${{ steps.v.outputs.name }}
          body_path: notes.md
          prerelease: ${{ steps.key.outputs.signed != 'true' }}
          files: dist/*
      - name: Remove key
        if: always()
        run: rm -f release.jks
