name: Release

# Push a tag like v1.3.0 to build a signed APK + AAB and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENOBD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Add the OPENOBD_KEYSTORE_BASE64 secret (see docs/RELEASING.md)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
      - name: Test
        run: ./gradlew testDebugUnitTest
      - name: Build signed APK and App Bundle
        env:
          OPENOBD_KEYSTORE_FILE: release.jks
          OPENOBD_KEYSTORE_PASSWORD: ${{ secrets.OPENOBD_KEYSTORE_PASSWORD }}
          OPENOBD_KEY_ALIAS: ${{ secrets.OPENOBD_KEY_ALIAS }}
          OPENOBD_KEY_PASSWORD: ${{ secrets.OPENOBD_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Rename artifacts
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/OpenOBD-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/OpenOBD-${GITHUB_REF_NAME}.aab"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Remove key
        if: always()
        run: rm -f release.jks
