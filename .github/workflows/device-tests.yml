name: Device tests

# Instrumented tests on real Android emulators: the demo car through the real UI, foreground service,
# notifications and storage, on the oldest supported Android, a middle one and a recent one.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          # Automated Test Device image: lighter and more reliable on CI than google_apis.
          - api-level: 30
            target: aosp_atd
          - api-level: 34
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-report-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
