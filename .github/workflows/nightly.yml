name: Nightly checks

# Things outside our control that can break without a code change: the public vehicle data services
# (EEA, RDW, EPA fueleconomy.gov, NHTSA vPIC) and the newest ELM327-emulator release.
on:
  # Weekly (Monday) instead of nightly, to save Actions minutes.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  live-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Vehicle lookups against the live services
        run: ./gradlew testDebugUnitTest --tests '*LiveSpecsTest' -PliveSpecs=true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-services-report
          path: app/build/reports/tests/testDebugUnitTest

  latest-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the newest ELM327-emulator
        run: |
          pip install "git+https://github.com/Ircama/ELM327-emulator.git"
          elm -V
          elm -n 35000 -s car -d
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/35000) 2>/dev/null && exit 0; sleep 1; done
          echo "emulator did not start"; exit 1
      - name: Session against the emulator
        run: ./gradlew testDebugUnitTest --tests '*ExternalEmulatorTest' -PelmEmulator=127.0.0.1:35000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-emulator-log
          path: app/build/elm-emulator.log
